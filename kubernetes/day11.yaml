apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels: 
  app: myapp-pod
spec:
  containers:
  - name: myapp-container
    image: busybox:1.28
    command: ['sh','-c', 'echo the app is running && sleep 60']
    env:
    - name: firstName
      value: "nikhil"
  initContainers:
  - name: init-myservice
    image: busybox:1.28
    command: ['sh', '-c']
    args: ['until nslookup myservice.default.svc.cluster.local; do echo wating for the service to be up; sleep 2;done']